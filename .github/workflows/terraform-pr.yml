name: Terraform PR Pipeline

on:
  push:
    branches:
      - feature

permissions:
  contents: write
  pull-requests: write

jobs:

  # ======================================================
  # 1. CREATE PULL REQUEST
  # ======================================================

  create-pr:
    name: Create Pull Request
    runs-on: ubuntu-latest

    outputs:
      pr_number: ${{ steps.create_pr.outputs.pr_number }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          PR_NUMBER=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "${GITHUB_REF_NAME}" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then

            echo "No existing PR found."

            PR_URL=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "${GITHUB_REF_NAME}" \
              --title "Terraform Changes - ${GITHUB_REF_NAME}" \
              --body "Automated Terraform PR from ${GITHUB_REF_NAME} to main.")

            PR_NUMBER=$(gh pr view "$PR_URL" \
              --repo "$GITHUB_REPOSITORY" \
              --json number \
              --jq '.number')

            echo "Created PR #$PR_NUMBER"

          else

            echo "PR #$PR_NUMBER already exists."

          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------
      # Request Reviewer
      # --------------------------------------------------

      - name: Request Reviewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
          REVIEWER: ${{ vars.REVIEWER_USERNAME }}
        run: |

          if [ -n "$REVIEWER" ]; then

            echo "Requesting reviewer: $REVIEWER"

            gh pr edit "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --add-reviewer "$REVIEWER"

          else

            echo "REVIEWER_USERNAME variable is not configured."

          fi


  # ======================================================
  # 2. TERRAFORM VALIDATE AND PLAN
  # ======================================================

  terraform:
    name: Terraform Validate and Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Project

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # --------------------------------------------------
      # Terraform Init
      # --------------------------------------------------

      - name: Terraform Init
        run: terraform init


      # --------------------------------------------------
      # Terraform Format
      # --------------------------------------------------

      - name: Terraform Format Check
        run: terraform fmt -check -recursive


      # --------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------

      - name: Terraform Validate
        run: terraform validate


      # --------------------------------------------------
      # Azure Login
      # --------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ vars.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ vars.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ vars.AZURE_TENANT_ID }}"
            }


      # --------------------------------------------------
      # Verify Azure Login
      # --------------------------------------------------

      - name: Verify Azure Login
        run: az account show


      # --------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------

      - name: Terraform Plan
        run: terraform plan -out=tfplan


      # --------------------------------------------------
      # Terraform Plan Summary
      # --------------------------------------------------

      - name: Terraform Plan Summary
        run: terraform show -no-color tfplan > tfplan.txt


      # --------------------------------------------------
      # Upload Terraform Plan
      # --------------------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: Project/tfplan.txt


  # ======================================================
  # 3. ENABLE AUTO MERGE
  # ======================================================

  enable-auto-merge:
    name: Enable Auto Merge
    runs-on: ubuntu-latest

    needs:
      - create-pr
      - terraform

    steps:

      - name: Enable Auto Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.create-pr.outputs.pr_number }}
        run: |

          echo "PR Number: $PR_NUMBER"

          PR_ID=$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json id \
            --jq '.id')

          echo "PR ID: $PR_ID"

          echo "Enabling auto-merge..."

          gh api graphql \
            -f query='
              mutation($pullRequestId:ID!) {
                enablePullRequestAutoMerge(
                  input: {
                    pullRequestId:$pullRequestId
                    mergeMethod:SQUASH
                  }
                ) {
                  pullRequest {
                    number
                    autoMergeRequest {
                      enabledAt
                      mergeMethod
                    }
                  }
                }
              }' \
            -f pullRequestId="$PR_ID"

          echo "Auto-merge enabled successfully."